<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src blob:; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
  <title>MyForeverChat 表情包制作器</title>
  <style>
    :root {
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
      color: #edf5ef;
      background: #111816;
      --panel: #1a2420;
      --edge: #3b4c42;
      --muted: #adbbb1;
      --mint: #a6e6b8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1100px; margin: auto; padding: 46px 26px 60px; }
    header { margin-bottom: 28px; }
    .brand { color: var(--mint); font-size: .81rem; font-weight: 700; letter-spacing: .14em; }
    h1 { margin: 7px 0 10px; font-size: clamp(1.9rem, 5vw, 3rem); line-height: 1.15; }
    h2 { margin: 0; font-size: 1.15rem; }
    p { margin: 0; }
    .subtle, small { color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 18px; align-items: start; }
    section { border: 1px solid var(--edge); border-radius: 14px; background: var(--panel); padding: 19px; }
    .heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .count { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .drop-zone { padding: 20px 14px; text-align: center; border: 1px dashed #668675; border-radius: 9px; }
    .drop-zone.dragging { border-color: var(--mint); background: #293d32; }
    .drop-zone p { margin-top: 8px; font-size: .85rem; }
    label { display: block; font-size: .87rem; font-weight: 600; }
    input, button { font: inherit; }
    input[type=text] {
      width: 100%; min-width: 0; padding: 8px 9px; border: 1px solid var(--edge);
      border-radius: 6px; background: #101814; color: inherit;
    }
    input[aria-invalid=true] { border-color: #f2a59d; }
    button {
      display: inline-flex; align-items: center; justify-content: center; min-height: 40px;
      padding: 7px 13px; border: 1px solid var(--edge); border-radius: 7px;
      background: #25382d; color: #ecf6ee; font-weight: 650; cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--mint); }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
    .items { list-style: none; padding: 0; margin: 0; }
    .item { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 11px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--edge); }
    .item:last-child { border-bottom: none; padding-bottom: 0; }
    .preview { display: block; border-radius: 6px; border: 1px solid var(--edge); background: repeating-conic-gradient(#34453c 0% 25%, #23332a 0% 50%) 50% / 16px 16px; }
    .filename { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 3px 0; }
    .remove { font-size: .83rem; padding-inline: 9px; }
    .field { margin: 0 0 15px; }
    .field input { margin-top: 5px; }
    #pack-code { font-family: ui-monospace, monospace; }
    .field small { display: block; margin-top: 5px; line-height: 1.4; }
    #export { width: 100%; background: var(--mint); border-color: var(--mint); color: #12241a; margin: 3px 0 10px; }
    #status { min-height: 1.55em; margin-top: 12px; color: var(--muted); overflow-wrap: anywhere; }
    #status[data-tone=error] { color: #ffc0b8; }
    @media (max-width: 720px) {
      main { padding: 25px 16px 42px; }
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">MYFOREVERCHAT</p>
      <h1>表情包制作器</h1>
      <p class="subtle">选好图片，给表情起名，再把生成的 ZIP 发给朋友。图片只在这台电脑上处理。</p>
    </header>
    <div class="layout">
      <section aria-labelledby="import-heading">
        <div class="heading">
          <h2 id="import-heading">1. 添加图片</h2>
          <span class="count" id="count">0 / 48 张</span>
        </div>
        <div class="drop-zone" id="drop-zone">
          <input type="file" id="files" accept="image/*,.png,.jpg,.jpeg,.webp,.gif,.avif,.bmp" multiple hidden>
          <button type="button" id="pick-files">选择图片</button>
          <p class="subtle">也可以拖入图片。支持 PNG、JPG、WebP 等浏览器可读取的格式，动图会转为静态图。</p>
        </div>
        <p id="status" role="status" aria-live="polite">单张图片最多 25 MB。</p>
        <ul class="items" id="items" aria-label="表情图片"></ul>
      </section>
      <section aria-labelledby="export-heading">
        <div class="heading"><h2 id="export-heading">2. 打包分享</h2></div>
        <div class="field">
          <label for="pack-name">表情包名称</label>
          <input id="pack-name" type="text" value="我的表情包" maxlength="48" autocomplete="off">
        </div>
        <div class="field">
          <label for="pack-code">包编号</label>
          <input id="pack-code" type="text" maxlength="24" autocomplete="off" spellcheck="false" aria-describedby="code-hint">
          <small id="code-hint">用 3–24 位小写字母、数字或下划线。更新旧包时，沿用原包编号和图片文件名。</small>
        </div>
        <button type="button" id="export" disabled>下载分享 ZIP</button>
        <p class="subtle"><small>安装说明随 ZIP 附上。双方装同一个包就能看到图片，其他玩家看到表情标签。</small></p>
      </section>
    </div>
  </main>
  <script>
    const TEXT_LIMIT = 48;
    const ITEM_LIMIT = 48;
    const FILE_LIMIT = 25 * 1024 * 1024;
    const TILE_SIZE = 64;
    const utf8 = new TextEncoder();
    const invalidText = /[\x00-\x1f\x7f-\x9f\u2028\u2029|\[\]]/;
    const packCodePattern = /^[a-z0-9_]{3,24}$/;
    const files = document.getElementById("files");
    const fileButton = document.getElementById("pick-files");
    const dropZone = document.getElementById("drop-zone");
    const itemsList = document.getElementById("items");
    const count = document.getElementById("count");
    const status = document.getElementById("status");
    const packName = document.getElementById("pack-name");
    const packCode = document.getElementById("pack-code");
    const exportButton = document.getElementById("export");
    const items = [];
    let loading = false;

    packCode.value = "p_" + Array.from(crypto.getRandomValues(new Uint8Array(6)), byte =>
      byte.toString(16).padStart(2, "0")).join("");

    function updateControls() {
      count.textContent = `${items.length} / ${ITEM_LIMIT} 张`;
      files.disabled = loading || items.length >= ITEM_LIMIT;
      fileButton.disabled = files.disabled;
      exportButton.disabled = loading || items.length === 0;
    }

    function showStatus(message, error = false) {
      status.textContent = message;
      status.dataset.tone = error ? "error" : "normal";
    }

    function validText(value) {
      return value.length > 0 && !invalidText.test(value) && utf8.encode(value).length <= TEXT_LIMIT;
    }

    function limitText(value, maxBytes) {
      let text = "";
      let bytes = 0;
      for (const char of value) {
        bytes += utf8.encode(char).length;
        if (bytes > maxBytes) break;
        text += char;
      }
      return text.trimEnd();
    }

    function newLabel(fileName) {
      const stem = fileName.replace(/\.[^.]+$/, "").normalize("NFC");
      const base = limitText(Array.from(stem, char => invalidText.test(char) ? " " : char).join("").trim(), TEXT_LIMIT) || "表情";
      const used = new Set(items.map(item => item.label.value.trim().normalize("NFC").toLowerCase()));
      let name = base;
      for (let number = 2; used.has(name.toLowerCase()); number++) {
        const suffix = ` (${number})`;
        name = limitText(base, TEXT_LIMIT - suffix.length) + suffix;
      }
      return name;
    }

    function itemId(fileName) {
      let hash = 0x811c9dc5;
      for (const byte of utf8.encode(fileName.normalize("NFC"))) {
        hash = Math.imul(hash ^ byte, 0x01000193);
      }
      return "e_" + (hash >>> 0).toString(16).padStart(8, "0");
    }

    function loadImage(file) {
      const url = URL.createObjectURL(file);
      const image = new Image();
      return new Promise((resolve, reject) => {
        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("浏览器无法读取这张图片"));
        };
        image.src = url;
      });
    }

    function makeTga(rgba) {
      const bytes = new Uint8Array(18 + TILE_SIZE * TILE_SIZE * 4);
      const header = new DataView(bytes.buffer);
      header.setUint8(2, 2); // Uncompressed true-color image.
      header.setUint16(12, TILE_SIZE, true);
      header.setUint16(14, TILE_SIZE, true);
      header.setUint8(16, 32);
      header.setUint8(17, 8); // Eight alpha bits, bottom-left origin.
      let output = 18;
      for (let y = TILE_SIZE - 1; y >= 0; y--) {
        for (let x = 0; x < TILE_SIZE; x++) {
          const pixel = (y * TILE_SIZE + x) * 4;
          bytes[output++] = rgba[pixel + 2];
          bytes[output++] = rgba[pixel + 1];
          bytes[output++] = rgba[pixel];
          bytes[output++] = rgba[pixel + 3];
        }
      }
      return bytes;
    }

    async function convertImage(file) {
      if (!file.size || file.size > FILE_LIMIT) throw new Error("图片必须小于或等于 25 MB");
      const image = await loadImage(file);
      if (!image.naturalWidth || !image.naturalHeight) throw new Error("读不到图片尺寸");
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = TILE_SIZE;
      canvas.className = "preview";
      canvas.setAttribute("aria-hidden", "true");
      const context = canvas.getContext("2d");
      if (!context) throw new Error("浏览器无法处理图片");
      context.imageSmoothingQuality = "high";
      const scale = TILE_SIZE / Math.max(image.naturalWidth, image.naturalHeight);
      const width = image.naturalWidth * scale;
      const height = image.naturalHeight * scale;
      context.drawImage(image, (TILE_SIZE - width) / 2, (TILE_SIZE - height) / 2, width, height);
      return { canvas, tga: makeTga(context.getImageData(0, 0, TILE_SIZE, TILE_SIZE).data) };
    }

    function appendItem(file, id, image) {
      const item = { id, tga: image.tga, label: document.createElement("input") };
      const row = document.createElement("li");
      row.className = "item";
      const fields = document.createElement("div");
      const label = document.createElement("label");
      label.htmlFor = id;
      label.textContent = "表情名称";
      const filename = document.createElement("small");
      filename.className = "filename";
      filename.textContent = file.name;
      filename.title = file.name;
      item.label.id = id;
      item.label.type = "text";
      item.label.maxLength = TEXT_LIMIT;
      item.label.value = newLabel(file.name);
      item.label.addEventListener("input", () => item.label.removeAttribute("aria-invalid"));
      fields.append(label, filename, item.label);
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "remove";
      remove.textContent = "移除";
      remove.setAttribute("aria-label", `移除 ${file.name}`);
      remove.addEventListener("click", () => {
        items.splice(items.indexOf(item), 1);
        row.remove();
        updateControls();
        showStatus(`已移除 ${file.name}`);
      });
      row.append(image.canvas, fields, remove);
      itemsList.append(row);
      items.push(item);
    }

    async function importFiles(selection) {
      if (loading || !selection.length) return;
      loading = true;
      updateControls();
      showStatus("正在转换图片…");
      let imported = 0;
      const errors = [];
      for (const file of selection) {
        if (items.length >= ITEM_LIMIT) {
          errors.push("已达到 48 张上限");
          break;
        }
        const id = itemId(file.name);
        if (items.some(item => item.id === id)) {
          errors.push(`${file.name} 的编号已存在。若是不同图片，请改文件名再导入`);
          continue;
        }
        try {
          appendItem(file, id, await convertImage(file));
          imported++;
        } catch (error) {
          errors.push(`${file.name} · ${error.message}`);
        }
      }
      loading = false;
      updateControls();
      const summary = imported ? `已添加 ${imported} 张图片。` : "";
      const rest = errors.length > 2 ? `，另有 ${errors.length - 2} 张未导入` : "";
      showStatus(summary + errors.slice(0, 2).join("；") + rest, errors.length > 0);
    }

    // This archive uses ZIP Store so the importer has no compression dependency.
    const crcTable = new Uint32Array(256);
    for (let i = 0; i < crcTable.length; i++) {
      let remainder = i;
      for (let bit = 0; bit < 8; bit++) {
        remainder = (remainder >>> 1) ^ ((remainder & 1) ? 0xedb88320 : 0);
      }
      crcTable[i] = remainder;
    }

    function crc32(bytes) {
      let result = 0xffffffff;
      for (const byte of bytes) result = (result >>> 8) ^ crcTable[(result ^ byte) & 255];
      return (result ^ 0xffffffff) >>> 0;
    }

    function makeZip(entries) {
      const contents = [];
      const directory = [];
      let offset = 0;
      let directorySize = 0;
      for (const entry of entries) {
        const name = utf8.encode(entry.name);
        const checksum = crc32(entry.bytes);
        const size = entry.bytes.length;
        const local = new DataView(new ArrayBuffer(30));
        local.setUint32(0, 0x04034b50, true);
        local.setUint16(4, 20, true);
        local.setUint16(6, 0x0800, true); // UTF-8 names.
        local.setUint16(12, 33, true); // 1980-01-01 DOS date.
        local.setUint32(14, checksum, true);
        local.setUint32(18, size, true);
        local.setUint32(22, size, true);
        local.setUint16(26, name.length, true);
        contents.push(local.buffer, name, entry.bytes);

        const central = new DataView(new ArrayBuffer(46));
        central.setUint32(0, 0x02014b50, true);
        central.setUint16(4, 20, true);
        central.setUint16(6, 20, true);
        central.setUint16(8, 0x0800, true);
        central.setUint16(14, 33, true);
        central.setUint32(16, checksum, true);
        central.setUint32(20, size, true);
        central.setUint32(24, size, true);
        central.setUint16(28, name.length, true);
        central.setUint32(42, offset, true);
        directory.push(central.buffer, name);
        offset += 30 + name.length + size;
        directorySize += 46 + name.length;
      }
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true);
      end.setUint16(8, entries.length, true);
      end.setUint16(10, entries.length, true);
      end.setUint32(12, directorySize, true);
      end.setUint32(16, offset, true);
      return new Blob([...contents, ...directory, end.buffer], { type: "application/zip" });
    }

    function luaString(value) {
      return '"' + value.replaceAll("\\", "\\\\").replaceAll('"', '\\"') + '"';
    }

    function textEntry(name, text) {
      return { name, bytes: utf8.encode(text) };
    }

    function rejectInput(input, message) {
      input.setAttribute("aria-invalid", "true");
      input.focus();
      showStatus(message, true);
    }

    function exportPack() {
      const code = packCode.value.trim();
      const name = packName.value.trim().normalize("NFC");
      if (!validText(name)) {
        rejectInput(packName, "表情包名称需为 1–48 字节，不可包含方括号、竖线或控制字符。");
        return;
      }
      if (!packCodePattern.test(code)) {
        rejectInput(packCode, "包编号需为 3–24 位小写字母、数字或下划线。");
        return;
      }
      const labels = new Set();
      const definitions = [];
      for (const item of items) {
        const label = item.label.value.trim().normalize("NFC");
        if (!validText(label) || labels.has(label.toLowerCase())) {
          rejectInput(item.label, "每个表情需要一个不同的名称，限 48 字节，不可包含方括号、竖线或控制字符。");
          return;
        }
        labels.add(label.toLowerCase());
        definitions.push({ id: item.id, label });
      }
      const addon = `MyForeverChatEmotes_${code}`;
      const manifestItems = definitions.map(item => `        { id = ${luaString(item.id)}, label = ${luaString(item.label)} },`);
      const manifest = [
        "MyForeverChatEmotePacks = MyForeverChatEmotePacks or {}",
        `MyForeverChatEmotePacks[${luaString(code)}] = {`,
        `    title = ${luaString(name)},`,
        "    items = {",
        ...manifestItems,
        "    },",
        "}",
        "",
      ].join("\n");
      const toc = ["## Interface: 16001", `## Title: ${name}`, "## Notes: MyForeverChat 自定义表情包", "Pack.lua", ""].join("\n");
      const instructions = [
        `${name} · MyForeverChat 表情包`,
        `包编号 ${code}`,
        "",
        "1. 先安装支持自定义表情包的 MyForeverChat，然后完全退出游戏。",
        `2. 将解压出的 ${addon} 文件夹放到 _forever_/Interface/AddOns。`,
        "3. 重启游戏，在角色选择界面启用 MyForeverChat 和这个表情包。",
        "4. 进游戏输入 /wx，打开「表情」，选择这个表情包。",
        "",
        "把这个 ZIP 转发给朋友即可共享。更新原包时，请保留包编号和图片文件名。",
        "",
        ...definitions.map(item => `${item.label}  [表情:${code}:${item.id}]`),
        "",
      ].join("\r\n");
      const zip = makeZip([
        textEntry(`${addon}/${addon}.toc`, toc),
        textEntry(`${addon}/Pack.lua`, manifest),
        ...items.map(item => ({ name: `${addon}/Media/${item.id}.tga`, bytes: item.tga })),
        textEntry("安装说明.txt", "\ufeff" + instructions),
      ]);
      const url = URL.createObjectURL(zip);
      const download = document.createElement("a");
      download.href = url;
      download.download = `${addon}.zip`;
      document.body.append(download);
      download.click();
      download.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60_000);
      showStatus(`已生成 ${items.length} 张表情的 ZIP。`);
    }

    fileButton.addEventListener("click", () => files.click());
    files.addEventListener("change", () => {
      const selection = Array.from(files.files);
      files.value = "";
      importFiles(selection);
    });
    window.addEventListener("dragover", event => event.preventDefault());
    window.addEventListener("drop", event => event.preventDefault());
    dropZone.addEventListener("dragover", event => {
      if (!files.disabled) dropZone.classList.add("dragging");
      event.dataTransfer.dropEffect = files.disabled ? "none" : "copy";
    });
    dropZone.addEventListener("dragleave", event => {
      if (!dropZone.contains(event.relatedTarget)) dropZone.classList.remove("dragging");
    });
    dropZone.addEventListener("drop", event => {
      event.preventDefault();
      dropZone.classList.remove("dragging");
      importFiles(Array.from(event.dataTransfer.files));
    });
    for (const input of [packName, packCode]) {
      input.addEventListener("input", () => input.removeAttribute("aria-invalid"));
    }
    exportButton.addEventListener("click", exportPack);
  </script>
</body>
</html>
