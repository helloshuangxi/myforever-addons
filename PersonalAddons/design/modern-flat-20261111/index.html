<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>静石 · 游戏内插件样张</title><link rel="stylesheet" href="styles.css"></head>
<body class="native-review">
<header class="sample-toolbar">
<div class="sample-name"><h1>静石</h1><span>界面样张</span></div>
<label class="sr-only" for="plugin-picker">选择插件样张</label><select id="plugin-picker"><option value="professions">商业技能助手</option><option value="chat">微信式聊天</option><option value="navigator">世界向导</option><option value="targets">目标选择</option><option value="macros">个人宏工坊</option><option value="fieldkit">随身手册</option><option value="coach">AI 教练 · 采集原型</option></select>
<div class="view-tabs" role="tablist" aria-label="设计内容"><button role="tab" aria-selected="true" aria-controls="preview-view" id="tab-preview" data-view="preview">样张</button><button role="tab" aria-selected="false" aria-controls="visual-view" id="tab-visual" data-view="visual" tabindex="-1">控件</button><button role="tab" aria-selected="false" aria-controls="decisions-view" id="tab-decisions" data-view="decisions" tabindex="-1">交互</button></div>
<div class="sample-utilities"><button id="notes-toggle" class="text-button" aria-expanded="false" aria-controls="design-notes">设计说明</button><a href="book.html" target="_blank" rel="noopener">美术圣经 ↗</a></div>
</header>
<nav id="plugin-nav" aria-label="插件示例" hidden></nav>
<main class="sample-main">
<section id="preview-view" role="tabpanel" aria-labelledby="tab-preview">
<div class="sample-options"><label for="scenario">显示状态</label><select id="scenario"><option value="rest">默认收起</option><option value="normal">主动展开</option><option value="alert">短时提醒</option><option value="combat">战斗 · 已展开</option><option value="empty">无数据</option><option value="error">不可用</option></select><button class="secondary" data-action="normal" id="open-panel">打开面板</button><div class="density-control"><label for="density">密度</label><select id="density"><option value="standard">标准</option><option value="compact">紧凑</option></select></div><div class="material-control"><label for="surface-alpha">底板不透明度</label><input id="surface-alpha" type="range" min="72" max="94" step="1" value="84"><output id="surface-alpha-value" for="surface-alpha">84% / 透明 16%</output><select id="surface-background" aria-label="材质检视背景"><option value="terrain">明暗材质示意</option><option value="dark">深色背景</option><option value="light">明亮背景</option></select></div><span>设计提案 1.2</span></div>
<div class="artboard"><div class="screen" id="screen" data-surface="terrain"></div><aside class="design-notes" id="design-notes"></aside></div>
<footer class="sample-status"><div><strong id="page-title">商业技能助手</strong><span id="page-description">主画面优先，按需展开。</span></div><small>全部为示例数据 · 背景为材质示意 · 本工具栏不属于游戏内界面</small></footer>
</section>
<section id="visual-view" role="tabpanel" aria-labelledby="tab-visual" hidden></section>
<section id="decisions-view" role="tabpanel" aria-labelledby="tab-decisions" hidden></section>
</main>
<div id="appearance-popover" popover aria-label="外观设置" class="appearance-popover"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="modal"><div class="modal-title"><h2 id="modal-heading"></h2><button id="modal-close" class="icon-button" aria-label="关闭对话框">×</button></div><div id="modal-body"></div></dialog>
<script src="app.js"></script></body></html>
