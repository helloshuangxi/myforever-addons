<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light dark">
<title>问路 · 我的无限世界向导</title>
<link rel="canonical" href="https://afabiaoge.xyz/navigator/planner/">
<link rel="stylesheet" href="./planner.css">
<script type="module" src="./planner.js"></script>
</head>
<body>
<main>
  <a href="/navigator/" class="brand"><span aria-hidden="true">导</span> 世界向导</a>
  <h1>你想去哪儿？</h1>
  <form id="search"><label for="question">输入 NPC、地点或你要办的事，多个目的地用“再去”分开。</label>
    <textarea id="question" name="question" rows="2" maxlength="240" placeholder="先去暴风城存东西，再去铁炉堡学采矿" required></textarea>
    <button id="lookup" type="submit" disabled>查找路线</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="model-choice" hidden><h2>用本机模型理解问法</h2>
    <p>首次从 Hugging Face 下载约 290 MB，之后优先使用浏览器缓存。需要支持 WebGPU 的浏览器；也可以改用 NPC 名称或服务名直接查找。</p>
    <button id="infer" type="button">启用模型并解析</button>
    <details id="manual"><summary>直接从候选中选择</summary><div id="choices"></div><button id="use-choices" type="button">查看所选路线</button></details>
  </section>
  <section id="result" hidden><h2>目的地顺序</h2><ol id="stops"></ol>
    <p>回到游戏，在聊天框粘贴命令，再为每一站选择具体地点。</p>
    <label for="command">游戏导航命令</label><textarea id="command" rows="2" readonly spellcheck="false"></textarea>
    <button id="copy" type="button">确认并复制路线</button>
  </section>
  <footer><a href="/navigator/">返回插件页</a><a href="./sources.txt">数据与模型来源</a></footer>
</main>
</body></html>
